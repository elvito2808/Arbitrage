[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "arbitrage-simulation"
version = "0.1.0"
description = "Core infrastructure for the Arbitrage simulator"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3", "aiohttp>=3.11,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
